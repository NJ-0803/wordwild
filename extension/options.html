<!doctype html><meta charset="utf-8"><title>Wordwild settings</title><link rel="stylesheet" href="ui.css">
<style>body{max-width:580px;margin:32px auto;padding:0 20px 40px}label{display:block;margin:22px 0 8px}#msg{margin-top:12px}.orb{margin:0 0 14px}</style>
<div class="orb" role="img" aria-label="Wordwild"></div>
<h1>Settings</h1>
<label class="label" for="trigger">When should the meaning appear?</label>
<div class="beam"><select id="trigger"><option value="any">Select a word, then press any letter key</option><option value="d">Select a word, then press D</option><option value="off">Never (use the toolbar button only)</option></select></div>
<p class="s">The meaning never opens while you are typing in a box, and never when you hold Ctrl, Cmd or Alt.</p>
<label class="label" for="base">Wordwild address</label>
<div class="beam"><input id="base" placeholder="https://wordwild-seven.vercel.app"></div>
<p class="s">Where your Wordwild lives. Only the word you select is sent there, never the page or its address.</p>
<div class="beam" style="margin-top:18px"><button id="save">Save</button></div><div id="msg" role="status"></div><script src="options.js"></script>
