<!doctype html><meta charset="utf-8"><title>Wordwild</title>

input{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:10px;border:2px solid #3a4348;background:#14181a;color:#f2efe8}

<h1>Wordwild</h1><p class="s">Type a word, or select one on any page and press a key.</p>
